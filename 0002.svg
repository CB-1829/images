<svg width="260" height="160" viewBox="0 0 260 160" xmlns="http://www.w3.org/2000/svg">

  <!-- Metal housing -->
  <rect x="20" y="40" width="220" height="80" rx="14"
        fill="#c7ccd1" stroke="#8a8f94" stroke-width="4"/>

  <!-- Inner cavity -->
