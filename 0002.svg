        fill="#2b2b30"/>

  <!-- Gold contacts -->
  <g fill="#d9b24c">
    <rect x="96" y="64" width="8" height="18" rx="2"/>
    <rect x="110" y="64" width="8" height="18" rx="2"/>
    <rect x="124" y="64" width="8" height="18" rx="2"/>
    <rect x="138" y="64" width="8" height="18" rx="2"/>
    <rect x="152" y="64" width="8" height="18" rx="2"/>
    <rect x="166" y="64" width="8" height="18" rx="2"/>
  </g>

  <!-- Mounting pads -->
  <g fill="#d0d3d8">
    <rect x="20" y="46" width="18" height="12" rx="3"/>
    <rect x="20" y="102" width="18" height="12" rx="3"/>
    <rect x="222" y="46" width="18" height="12" rx="3"/>
    <rect x="222" y="102" width="18" height="12" rx="3"/>
  </g>

</svg>
